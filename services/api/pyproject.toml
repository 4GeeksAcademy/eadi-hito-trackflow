[project]
name = "trackflow-api"
version = "0.1.0"
description = "TrackFlow operational API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "tinydb>=4.8,<5",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic[email]>=2.0,<3",
  "python-jose[cryptography]>=3.5.0",
  "libpass[bcrypt]>=1.9.3",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["database", "models", "seed", "seed_data"]
